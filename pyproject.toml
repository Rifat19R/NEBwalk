[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebwalk"
version = "0.10.0"
description = "Calculator-agnostic nudged elastic band library with MLIP-assisted barrier pre-screening and DFT validation workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Md. Rifat Khandaker" }
]
requires-python = ">=3.9"
dependencies = [
    "ase>=3.22",
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
mace = ["mace-torch>=0.3.12,<0.4"]
training = ["mace-torch>=0.3.12,<0.4"]
test = ["pytest>=7", "pytest-cov>=5", "numpy"]
dev = ["nebwalk[test]", "build", "mypy", "ruff==0.16.7", "twine"]
docs = ["mkdocs>=1.6", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/Rifat19R/nebwalk"
Repository = "https://github.com/Rifat19R/nebwalk"
Issues = "https://github.com/Rifat19R/nebwalk/issues"

[project.scripts]
nebwalk = "nebwalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nebwalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

filterwarnings = [
    # MACE 0.3.x intentionally sets TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD
    # during import; this warning originates from e3nn's constants loader.
    'ignore:Environment variable TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD detected.*:UserWarning:e3nn\.o3\._wigner',

    # Upstream PyTorch/MACE/e3nn TorchScript deprecation.
    'ignore:`torch\.jit\.script` is deprecated.*:DeprecationWarning:torch\.jit\._script',
]


[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nebwalk"]

[tool.mypy]
python_version = "3.10"
files = ["src/nebwalk"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["nebwalk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
