site_name: nebwalk
site_description: Transparent ASE-compatible NEB and CI-NEB workflows
site_url: https://rifat19r.github.io/nebwalk/
repo_url: https://github.com/Rifat19R/nebwalk
repo_name: Rifat19R/nebwalk
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Getting started: getting-started/index.md
  - Tutorials: tutorials/index.md
  - How-to:
      - Overview: how-to/index.md
      - Active learning: how-to/active_learning.md
      - MLIP fine-tuning: how-to/mlip_finetuning.md
      - QE labeling: how-to/qe_labeling.md
      - Campaign recovery: how-to/campaign_recovery.md
      - Production use: how-to/production.md
  - Reference:
      - API reference: reference/api.md
      - Dataset schema: reference/dataset_schema.md
      - Scientific guidance: reference/scientific-guidance.md
      - Contributing: reference/contributing.md
markdown_extensions:
  - admonition
  - fenced_code
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
strict: true
