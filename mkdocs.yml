site_name: nebwalk
site_description: Transparent ASE-compatible NEB and CI-NEB workflows
site_url: https://rifat19r.github.io/nebwalk/
repo_url: https://github.com/Rifat19R/nebwalk
repo_name: Rifat19R/nebwalk
theme:
  name: readthedocs
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Scientific guidance: scientific-guidance.md
  - Production use: production.md
  - Release guide: pypi_release.md
  - Project announcement: linkedin_post.md
  - Active learning: active_learning.md
  - Dataset schema: dataset_schema.md
  - MACE fine-tuning: mlip_finetuning.md
  - QE labeling: qe_labeling.md
  - Campaign recovery: campaign_recovery.md
  - API reference: api.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - fenced_code
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
strict: true
