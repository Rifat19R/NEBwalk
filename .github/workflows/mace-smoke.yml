name: Optional MACE smoke

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional training stack
        run: pip install -e ".[training]"
      - name: Verify official MACE CLI contract
        run: nebwalk mlip check --protocol naive
