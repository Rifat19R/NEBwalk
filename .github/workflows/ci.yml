name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ -v --cov=nebwalk --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,docs]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy nebwalk
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel installation smoke test
        run: |
          python -m venv /tmp/nebwalk-wheel
          /tmp/nebwalk-wheel/bin/pip install dist/*.whl
          /tmp/nebwalk-wheel/bin/python -c "import nebwalk; from nebwalk.cli import build_parser; build_parser()"
      - run: mkdocs build --strict
